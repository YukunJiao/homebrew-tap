name: bump formulae

# Opens a PR when upstream Threadle publishes a new release (threadle) or
# opens a new dev-x.y branch (threadle-dev).
#
# Needs a repository secret TAP_BOT_TOKEN: a fine-grained personal access token
# for this repository with Contents and Pull requests read/write. PRs opened
# with the default GITHUB_TOKEN would not trigger brew test-bot, so no bottles
# would be built.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - formula: threadle
            script: bump-threadle.sh
          - formula: threadle-dev
            script: bump-threadle-dev.sh
    steps:
      - name: Check token
        env:
          TAP_BOT_TOKEN: ${{ secrets.TAP_BOT_TOKEN }}
        run: |
          if [ -z "$TAP_BOT_TOKEN" ]; then
            echo "::error::Repository secret TAP_BOT_TOKEN is not set."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TAP_BOT_TOKEN }}

      - name: Update formula
        id: update
        env:
          GH_TOKEN: ${{ secrets.TAP_BOT_TOKEN }}
        run: echo "new=$(.github/scripts/${{ matrix.script }})" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.update.outputs.new != ''
        env:
          GH_TOKEN: ${{ secrets.TAP_BOT_TOKEN }}
          FORMULA: ${{ matrix.formula }}
          NEW: ${{ steps.update.outputs.new }}
        run: |
          branch="bump/$FORMULA-$NEW"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists; a PR is already open or was handled."
            exit 0
          fi

          if [ "$FORMULA" = threadle ]; then
            title="threadle $NEW"
            body="Upstream released v$NEW.

          1. Wait for brew test-bot to pass and build bottles.
          2. Add the \`pr-pull\` label to publish the bottles and merge."
          else
            title="threadle-dev: track $NEW"
            body="Upstream opened a new dev branch \`$NEW\`. Merge to point threadle-dev at it."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$title"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body "$body"
